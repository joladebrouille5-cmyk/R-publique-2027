name: Android (APK)

# Phase 8 : construit l'APK de l'application hors ligne et l'essaie sur un émulateur Android.
# L'APK de débogage est publié comme artefact du workflow (onglet Actions → exécution →
# « Artifacts »). Un APK de publication signé n'est produit que si les secrets de signature
# R2027_KEYSTORE_BASE64, R2027_KEYSTORE_PASSWORD, R2027_KEY_ALIAS et R2027_KEY_PASSWORD sont
# configurés dans le dépôt (Settings → Secrets and variables → Actions).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.R2027_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      # Le gradle-wrapper.jar commité doit être un binaire officiel de Gradle.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile

      - name: Paquet web hors ligne et projet Android (Capacitor)
        run: pnpm --filter @r2027/mobile run android:sync

      - name: APK de débogage
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publier l'APK de débogage
        uses: actions/upload-artifact@v4
        with:
          name: republique-2027-apk-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: APK de publication signé (si les secrets de signature existent)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/mobile/android
        env:
          R2027_KEYSTORE_BASE64: ${{ secrets.R2027_KEYSTORE_BASE64 }}
          R2027_KEYSTORE_PASSWORD: ${{ secrets.R2027_KEYSTORE_PASSWORD }}
          R2027_KEY_ALIAS: ${{ secrets.R2027_KEY_ALIAS }}
          R2027_KEY_PASSWORD: ${{ secrets.R2027_KEY_PASSWORD }}
        run: |
          export R2027_KEYSTORE_FILE="$RUNNER_TEMP/republique-2027.jks"
          echo "$R2027_KEYSTORE_BASE64" | base64 --decode > "$R2027_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$R2027_KEYSTORE_FILE"

      - name: Publier l'APK signé
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: republique-2027-apk-release
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Activer KVM pour l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Essai sur émulateur Android 14 (hors réseau)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node apps/mobile/scripts/essai-android.mjs apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk essai-android

      - name: Captures de l'essai
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essai-android-captures
          path: essai-android/
          retention-days: 7
          if-no-files-found: ignore
