name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r2027_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valeurs propres à la CI, sans aucun secret réel (critère 14 : pas de clé requise).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/r2027_test
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/r2027_test
      SESSION_SECRET: secret-de-ci-non-sensible-0123456789-abcdefgh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Tests unitaires et de propriétés
        run: pnpm test
      - name: Tests d'intégration (PostgreSQL)
        run: pnpm test:integration
      - name: Navigateur Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests de bout en bout (bureau + mobile)
        run: pnpm test:e2e
      - run: pnpm build
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
