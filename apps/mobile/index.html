<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="RÉPUBLIQUE 2027 — simulation politique française, hors ligne"
    />
    <!--
      Application hors ligne : seuls les fichiers de l'application sont chargés. Aucune connexion
      sortante (connect-src 'self'), aucun script distant ni en ligne ; les cartes (MapLibre)
      utilisent des workers et des images « blob: ».
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>RÉPUBLIQUE 2027</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
