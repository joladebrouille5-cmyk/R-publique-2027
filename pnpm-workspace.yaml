packages:
  - apps/*
  - packages/*

# Dépendances autorisées à exécuter un script d'installation (pnpm 10 les bloque par défaut).
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma

# Correctifs de sécurité de dépendances indirectes d'outils de développement (jamais livrées dans
# l'application ni dans l'API) : adm-zip et fflate (mapshaper, import des données), uuid
# (@capacitor/cli > xcode, outillage iOS). Voir docs/RISQUES.md (R-41).
overrides:
  adm-zip@<0.6.1: 0.6.1
  fflate@<0.8.3: 0.8.3
  uuid@<11.1.1: 11.1.1
