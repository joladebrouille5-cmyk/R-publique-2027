# PostgreSQL de développement : `docker compose up -d db`
# Mot de passe de développement local uniquement (jamais utilisé en production).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-r2027_dev}
      POSTGRES_DB: r2027
    ports:
      - '127.0.0.1:${PGPORT:-5432}:5432'
    volumes:
      - r2027-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  r2027-pgdata:
